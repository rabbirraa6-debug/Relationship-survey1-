    loading.style.display = "block";
    quizArea.style.display = "none";

    const { data, error } = await db
        .from("quizzes")
        .select("id")
        .eq("gender", "girls")
        .eq("quiz_number", 1)
        .single();

    if (error || !data) {

        loading.innerHTML = `

                Quiz could not be loaded.

            <div style="font-size:13px;margin-top:7px;">

        `Question ${currentQuestion + 1} of ${questions.length}`;

    const percent =
        Math.round(((currentQuestion + 1) / questions.length) * 100);

    progressPercent.textContent = `${percent}%`;
    progressFill.style.width = `${percent}%`;

    optionsContainer.innerHTML = "";

    item.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.innerHTML = `
            <span class="option-letter">
                ${String.fromCharCode(65 + index)}
            </span>

            <span class="option-text">
                ${escapeHTML(option[0])}
            </span>
        `;

        button.addEventListener("click", () => {

            document
                .querySelectorAll(".option")
                .forEach(el => el.classList.remove("selected"));

            button.classList.add("selected");

            selectedScore = option[1];

            nextBtn.disabled = false;
        });

        optionsContainer.appendChild(button);
    });

    nextBtn.innerHTML =
        currentQuestion === questions.length - 1
            ? `Finish Quiz <i data-lucide="check"></i>`
            : `Next Question <i data-lucide="arrow-right"></i>`;

    lucide.createIcons();
}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextBtn.addEventListener("click", () => {

    if (selectedScore === null) return;

    totalScore += selectedScore;

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        renderQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        quizArea.style.display = "none";
        nameBox.style.display = "block";

        nameInput.focus();
    }
});


/* =========================================================
   SUBMIT
========================================================= */

submitBtn.addEventListener("click", submitQuiz);

nameInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        submitQuiz();
    }

});


async function submitQuiz() {

    const name = nameInput.value.trim();

    errorBox.style.display = "none";

    if (!name) {

        showError("Please enter your name.");

        nameInput.focus();

        return;
    }

    if (!quizId) {

        showError("Quiz connection is not ready.");

        return;
    }

    submitBtn.disabled = true;

    submitBtn.innerHTML = `
        Saving...
        <i data-lucide="loader-circle"></i>
    `;

    lucide.createIcons();


    /* SAVE PARTICIPANT */

    const { error: insertError } = await db
        .from("quiz_participants")
        .insert({
            quiz_id: quizId,
            name: name,
            score: totalScore
        });

    if (insertError) {

        console.error(insertError);

        showError(
            "Your result could not be saved. Please try again."
        );

        submitBtn.disabled = false;

        submitBtn.innerHTML = `
            Submit My Score
            <i data-lucide="check"></i>
        `;

        lucide.createIcons();

        return;
    }


    /* GET RANK */

    const { data: rankData, error: rankError } =
        await db.rpc("calculate_quiz_rank", {
            p_quiz_id: quizId,
            p_score: totalScore
        });

    let rank = "—";

    if (!rankError && rankData !== null) {
        rank = rankData;
    }

    showResult(rank);
}


/* =========================================================
   RESULT
========================================================= */

function showResult(rank) {

    nameBox.style.display = "none";
    result.style.display = "block";

    finalScore.textContent = totalScore;
    finalRank.textContent = `#${rank}`;

    const feedback = getFeedback(totalScore);

    resultTitle.textContent = feedback.title;
    resultMessage.textContent = feedback.message;

    lucide.createIcons();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   SCORE FEEDBACK
========================================================= */

function getFeedback(score) {

    if (score === 100) {

        return {
            title: "👑 PERFECT SCORE",
            message: "You understood the assignment."
        };

    }

    if (score >= 91) {

        return {
            title: "✨ GREEN FLAG",
            message: "Keep it healthy."
        };

    }

    if (score >= 81) {

        return {
            title: "💗 STRONG ENERGY",
            message: "You’re doing pretty well."
        };

    }

    if (score >= 71) {

        return {
            title: "💕 PRETTY HEALTHY",
            message: "Keep growing together."
        };

    }

    if (score >= 61) {

        return {
            title: "💭 MIXED SIGNALS",
            message: "Some things need attention."
        };

    }

    if (score >= 51) {

        return {
            title: "🌱 NEEDS WORK",
            message: "There’s room to grow."
        };

    }

    return {
        title: "🚩 RED FLAG",
        message: "Work on yourself 🫶"
    };
}


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener("click", () => {

    currentQuestion = 0;
    totalScore = 0;
    selectedScore = null;

    nameInput.value = "";

    result.style.display = "none";
    nameBox.style.display = "none";
    quizArea.style.display = "block";

    renderQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = "block";
}


/* =========================================================
   SAFE TEXT
========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   INITIALIZE
========================================================= */

lucide.createIcons();

loadQuiz();
</script>

</body>
</html>
