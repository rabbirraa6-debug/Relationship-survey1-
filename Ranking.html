<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz Ranking</title><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:#f7f9fc;color:#172033;min-height:100vh;user-select:none}.main{padding:30px}.page{max-width:1000px;margin:auto}.back{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:12px;background:#fff;border:1px solid #e1e6ef;color:#667084;font-weight:750;margin-bottom:20px}.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:30px;background:#f0f5ff;color:#477ee0;font-size:12px;font-weight:800;margin-bottom:18px}.header{margin-bottom:25px}.header h1{font-size:clamp(30px,6vw,45px);margin-bottom:7px}.header p{color:#758095}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{padding:10px 15px;border-radius:11px;background:#fff;border:1px solid #e1e6ef;color:#758095;font-weight:700}.tab.active{background:#edf4ff;color:#3477e7;border-color:#cfe0ff}.list{background:#fff;border:1px solid #e6ebf2;border-radius:21px;overflow:hidden}.row{display:grid;grid-template-columns:65px 1fr 100px 120px;align-items:center;padding:15px 18px;border-bottom:1px solid #eef1f5}.row:last-child{border:0}.num{font-weight:900;color:#778195}.name{font-weight:750}.score{text-align:right;font-weight:900}.cat{text-align:right;font-size:11px;font-weight:800;color:#7d8799}.loading,.empty,.error{padding:40px;text-align:center;color:#8791a3}@media(max-width:600px){.main{padding:18px 15px}.row{grid-template-columns:45px 1fr 70px}.cat{display:none}.score{font-size:14px}}</style></head><body><main class="main"><section class="page"><button class="back" onclick="location.href='index.html'"><i data-lucide="arrow-left" width="16"></i>Back to Quizzes</button><div class="header"><div class="badge"><i data-lucide="trophy" width="14"></i>RANKING</div><h1 id="title">Quiz Ranking</h1><p id="sub">Scores are ranked from highest to lowest.</p></div><div class="tabs"><button class="tab active" onclick="filter('all',this)">All</button><button class="tab" onclick="filter('keeper',this)">Keepers</button><button class="tab" onclick="filter('work',this)">Needs Work</button><button class="tab" onclick="filter('red',this)">Red Flags</button></div><div class="list" id="list"><div class="loading">Loading rankings...</div></div></section></main><script>const URL='https://wmsjpbcwhqghqtytztvv.supabase.co',KEY='sb_publishable_wVDgY_X5-1d4GvHx6Mg8kQ_SD1RptNc';const{createClient}=supabase,db=createClient(URL,KEY),p=new URLSearchParams(location.search),quizId=Number(p.get('quiz_id')),title=p.get('title')||'Quiz Ranking';let data=[],current='all';document.getElementById('title').textContent=title;document.getElementById('sub').textContent=title+' — scores ranked from highest to lowest.';function cat(s){return s>=85?{key:'keeper',text:'KEEPER'}:s>=50?{key:'work',text:'NEEDS WORK'}:{key:'red',text:'RED FLAG'}}async function load(){if(!quizId){document.getElementById('list').innerHTML='<div class="error">No quiz was selected.</div>';return}try{const{data:d,error}=await db.from('quiz_participants').select('id,name,score,created_at').eq('quiz_id',quizId).order('score',{ascending:false}).order('created_at',{ascending:true});if(error)throw error;data=d||[];render()}catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="error">Could not load rankings. Check your Supabase table and RLS policies.</div>'}}function render(){let list=current==='all'?data:data.filter(x=>cat(x.score).key===current);let ranks=new Map(),prev=null,rank=0;data.forEach((x,i)=>{if(i===0||x.score!==prev){rank=i+1}prev=x.score;ranks.set(x.id,rank)});if(!list.length){document.getElementById('list').innerHTML='<div class="empty">'+(data.length?'No participants in this category yet.':'No participants yet.')+'</div>';return}document.getElementById('list').innerHTML=list.map(x=>{let r=ranks.get(x.id),c=cat(x.score),name=r<=3?x.name:'***';return `<div class="row"><div class="num">#${r}</div><div class="name">${esc(name)}</div><div class="score">${x.score}/100</div><div class="cat">${c.text}</div></div>`}).join('')}function filter(f,b){current=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}lucide.createIcons();load();</script></body></html>
