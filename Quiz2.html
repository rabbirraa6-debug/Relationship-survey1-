    text:"My boyfriend becomes close friends with a woman he once found attractive. What would I do?",
    options:[
        ["A","Ask how their friendship developed",4],
        ["B","Tell him to keep some distance",2],
        ["C","Trust him unless he crosses a boundary",3],
        ["D","Become uncomfortable but say nothing",1]
    ]
},

{
    text:"My boyfriend tells me an ex contacted him but says he didn't reply. What would I do?",
    options:[
        ["A","Trust what he told me",4],
        ["B","Ask what the ex wanted",3],
        ["C","Ask to see the message",1],
        ["D","Feel suspicious even without evidence",2]
    ]
},

{
    text:"My boyfriend says he sometimes finds other women attractive but would never act on it. What would I do?",
    options:[
        ["A","Accept that attraction happens",4],
        ["B","Ask him not to talk about it",2],
        ["C","Become worried about his feelings",1],
        ["D","Tell him honestly how it makes me feel",3]
    ]
}

];


/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

let answers = new Array(questions.length).fill(null);

let quizId = null;

let quizFinished = false;


/* =========================================================
   FIND QUIZ 2
========================================================= */

async function loadQuizId(){

    const {data,error} = await db
        .from("quizzes")
        .select("id,gender,quiz_number,title,active")
        .eq("gender","girls")
        .eq("quiz_number",2)
        .maybeSingle();

    if(error){

        console.error(error);

        showToast(
            "Could not load Girls Quiz 2."
        );

        return false;
    }

    if(!data){

        showToast(
            "Girls Quiz 2 has not been created in the database yet."
        );

        return false;
    }

    quizId = data.id;

    return true;
}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

    const container =
        document.getElementById("questions");

    const q =
        questions[currentQuestion];

    let html = `

        <div class="question-card">

            <div class="question-number">
                Question ${currentQuestion + 1}
            </div>

            <div class="question-text">
                ${q.text}
            </div>

            <div class="options">
    `;

    q.options.forEach(option => {

        const letter = option[0];
        const label = option[1];
        const score = option[2];

        const selected =
            answers[currentQuestion] === score;

        html += `

            <button
                class="option ${selected ? "selected" : ""}"
                onclick="selectAnswer(${score})"
            >

                <span class="option-letter">
                    ${letter}
                </span>

                <span class="option-content">

                    <span class="option-label">
                        ${label}
                    </span>

                </span>

            </button>

        `;

    });

    html += `
            </div>
        </div>
    `;

    container.innerHTML = html;

    updateProgress();

    document.getElementById("previousBtn").disabled =
        currentQuestion === 0;

    const nextBtn =
        document.getElementById("nextBtn");

    if(currentQuestion === questions.length - 1){

        nextBtn.innerHTML = `
            <i data-lucide="check"></i>
            Finish Quiz
        `;

    }else{

        nextBtn.innerHTML = `
            Next
            <i data-lucide="arrow-right"></i>
        `;

    }

    lucide.createIcons();
}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(score){

    answers[currentQuestion] = score;

    renderQuestion();
}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

    if(answers[currentQuestion] === null){

        showToast(
            "Please choose an answer first."
        );

        return;
    }

    if(currentQuestion === questions.length - 1){

        finishQuiz();

        return;
    }

    currentQuestion++;

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion(){

    if(currentQuestion <= 0){
        return;
    }

    currentQuestion--;

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    const number =
        currentQuestion + 1;

    const percent =
        Math.round(
            (number / questions.length) * 100
        );

    document.getElementById(
        "progressText"
    ).textContent =
        `Question ${number} of ${questions.length}`;

    document.getElementById(
        "progressPercent"
    ).textContent =
        `${percent}%`;

    document.getElementById(
        "progressFill"
    ).style.width =
        `${percent}%`;
}


/* =========================================================
   SCORE CATEGORY
========================================================= */

function getResult(score){

    if(score <= 50){

        return {
            label:"🚩 RED FLAG",
            message:"Work on yourself 🫶"
        };

    }

    if(score <= 60){

        return {
            label:"🌱 NEEDS WORK",
            message:"There’s room to grow."
        };

    }

    if(score <= 70){

        return {
            label:"💭 MIXED SIGNALS",
            message:"Some things need attention."
        };

    }

    if(score <= 80){

        return {
            label:"💕 PRETTY HEALTHY",
            message:"Keep growing together."
        };

    }

    if(score <= 90){

        return {
            label:"💗 STRONG ENERGY",
            message:"You’re doing pretty well."
        };

    }

    if(score <= 99){

        return {
            label:"✨ GREEN FLAG",
            message:"Keep it healthy."
        };

    }

    return {
        label:"👑 PERFECT SCORE",
        message:"You understood the assignment."
    };
}


/* =========================================================
   FINISH
========================================================= */

async function finishQuiz(){

    const name =
        document
        .getElementById("participantName")
        .value
        .trim();

    if(!name){

        showToast(
            "Please enter your name first."
        );

        document
            .getElementById("participantName")
            .focus();

        return;
    }

    if(!quizId){

        const loaded =
            await loadQuizId();

        if(!loaded){
            return;
        }
    }

    const incomplete =
        answers.some(answer => answer === null);

    if(incomplete){

        showToast(
            "Please answer every question."
        );

        return;
    }


    const score =
        answers.reduce(
            (total,value) => total + value,
            0
        );


    /* SAVE SPECIFICALLY TO QUIZ 2 */

    const {data,error} = await db
        .from("quiz_participants")
        .insert({

            quiz_id:quizId,

            name:name,

            score:score

        })
        .select(
            "id,name,score,created_at,quiz_id"
        )
        .single();


    if(error){

        console.error(error);

        showToast(
            "Could not save your result."
        );

        return;
    }


    quizFinished = true;


    const result =
        getResult(score);


    document.getElementById(
        "resultScore"
    ).textContent =
        score;


    document.getElementById(
        "resultLabel"
    ).textContent =
        result.label;


    document.getElementById(
        "resultMessage"
    ).textContent =
        result.message;


    document
        .getElementById("resultCard")
        .classList.add("show");


    document
        .getElementById("questions")
        .style.display = "none";


    document
        .querySelector(".quiz-navigation")
        .style.display = "none";


    document
        .querySelector(".progress-card")
        .style.display = "none";


    document
        .querySelector(".name-card")
        .style.display = "none";


    document.getElementById(
        "resultCard"
    ).scrollIntoView({
        behavior:"smooth"
    });


    lucide.createIcons();

    showToast(
        "Your Quiz 2 result has been saved."
    );
}


/* =========================================================
   LOAD QUIZ 2 RANKING
========================================================= */

async function loadRanking(){

    if(!quizId){

        const loaded =
            await loadQuizId();

        if(!loaded){
            return;
        }
    }


    const list =
        document.getElementById(
            "rankingList"
        );

    list.innerHTML = `

        <div class="empty">

            <i data-lucide="loader-circle"></i>

            <div>
                Loading Quiz 2 ranking...
            </div>

        </div>
    `;

    lucide.createIcons();


    const {data,error} = await db
        .from("quiz_participants")
        .select(
            "id,name,score,created_at,quiz_id"
        )
        .eq("quiz_id",quizId)
        .order(
            "score",
            {ascending:false}
        )
        .order(
            "created_at",
            {ascending:true}
        );


    if(error){

        console.error(error);

        list.innerHTML = `

            <div class="empty">

                <i data-lucide="triangle-alert"></i>

                <div>
                    Could not load the Quiz 2 ranking.
                </div>

            </div>
        `;

        lucide.createIcons();

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML = `

            <div class="empty">

                <i data-lucide="trophy"></i>

                <div>
                    No participants yet.
                </div>

                <div style="margin-top:6px;font-size:12px;">
                    Quiz 2 will appear here after people complete it.
                </div>

            </div>
        `;

        lucide.createIcons();

        return;
    }


    let currentRank = 1;

    let previousScore = null;


    list.innerHTML =
        data.map((person,index) => {

            if(
                index === 0 ||
                person.score !== previousScore
            ){

                currentRank = index + 1;

            }


            previousScore =
                person.score;


            /*
             * ONLY TOP 3 NAMES ARE VISIBLE.
             * RANK #4+ AUTOMATICALLY BECOMES ***
             */

            const displayName =
                currentRank <= 3
                    ? escapeHtml(person.name)
                    : "***";


            const category =
                getCategory(person.score);


            return `

                <div class="ranking-row">

                    <div class="rank-number">
                        #${currentRank}
                    </div>

                    <div class="rank-name">
                        ${displayName}
                    </div>

                    <div class="rank-score">
                        ${person.score}
                    </div>

                    <div class="rank-category">
                        ${category}
                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   CATEGORY
========================================================= */

function getCategory(score){

    if(score >= 85){
        return "KEEPER";
    }

    if(score >= 50){
        return "NEEDS WORK";
    }

    return "RED FLAG";
}


/* =========================================================
   SHOW RANKING
========================================================= */

async function showRanking(){

    document
        .getElementById("rankingSection")
        .classList.add("show");


    document
        .getElementById("rankingSection")
        .scrollIntoView({
            behavior:"smooth"
        });


    await loadRanking();
}


/* =========================================================
   RETAKE
========================================================= */

function restartQuiz(){

    currentQuestion = 0;

    answers =
        new Array(
            questions.length
        ).fill(null);

    quizFinished = false;


    document
        .getElementById("resultCard")
        .classList.remove("show");


    document
        .getElementById("questions")
        .style.display = "block";


    document
        .querySelector(".quiz-navigation")
        .style.display = "flex";


    document
        .querySelector(".progress-card")
        .style.display = "block";


    document
        .querySelector(".name-card")
        .style.display = "block";


    document
        .getElementById("rankingSection")
        .classList.remove("show");


    renderQuestion();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

    window.location.href =
        "index.html";
}


function goBoys(){

    window.location.href =
        "index.html#boys";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },3000);
}


/* =========================================================
   START
========================================================= */

async function init(){

    lucide.createIcons();

    renderQuestion();

    await loadQuizId();

}


/* =========================================================
   RUN
========================================================= */

init();

</script>
